      text: " Jan Assmann f\xFChrt Halbwachs\u2018 Konzept des kollektiven Ged\xE4\
        chtnisses weiter und pr\xE4zisiert es. Er unterscheidet das  kom-\nmunikative\
        \  Ged\xE4chtnis,  das  dem  kollektiven  Ged\xE4chtnis  von  Halbwachs  entspricht,\
        \  vom  kulturellen  Ged\xE4chtnis  (Fornoff\n2016: 59-60). Erstes beruht\
        \ auf Alltagskommunikation und umfasst einen Erinnerungszeitraum von 3-4 Generationen\
        \ (etwa\n80-100 Jahre) (Assmann 1988: 11). Das kulturelle Ged\xE4chtnis hingegen\
        \ ist alltagsfern und hat \u201EFixpunkte\u201C, bei denen es sich\num  \u201E\
        schicksalhafte  Ereignisse  der  Vergangenheit\u201C  handelt,  \u201Ederen\
        \  Erinnerung  durch  kulturelle  Formung  (Texte,  Riten,\nDenkm\xE4ler)\
        \  und  institutionalisierte  Kommunikation  (Rezitation,  Begehung,  Betrachtung)\
        \  wachgehalten  wird.\u201C  (ebd.:  12)\nLetzteres wird somit nicht mehr\
        \ \xFCber Zeitzeugen weitergegeben, sondern ben\xF6tigt f\xFCr die Weitergabe\
        \ \u201Emateriale Objektivati-\nonen [\u2026] wie Schrift, Bild oder Ritus\u201C\
        \ als Erinnerungsinstanz (Fornoff 2016: 61).\n"
