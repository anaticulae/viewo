      text: " Zur \xDCbersetzung des Begriffs ins Deutsche: Wolfgang Kaiser, der 1992\
        \ die \xDCbersetzung von Noras Entre M\xE9moire et His-\ntoire anfertigte,\
        \ entschied sich f\xFCr den Begriff Ged\xE4chtnisort. Von Fran\xE7ois und\
        \ Schulze wurde hingegen der Begriff Erinne-\nrungsort  f\xFCr  ihre  \xDC\
        bertragung  der  Lieux  de  m\xE9moire  auf  Deutschland  gew\xE4hlt,  aus\
        \  dem  Grund,  das  mit  ihm  \u201Edas  aktive,\ndynamische  und  transformative\
        \  Moment  des  Erinnerungsprozesses  wesentlich  st\xE4rker  akzentuiert\
        \  wird  als  mit  Kaisers  Be-\ngriff des \u201AGed\xE4chtsnisorts\u2018\
        \ [\u2026]\u201C (Fornoff 2016: 75). Zudem war der Begriff bereits in kulturwissenschaftlichen\
        \ Zusammen-\nh\xE4ngen  fest  etabliert  (ebd.:  75).  Die  unterschiedliche\
        \  \xDCbersetzung  h\xE4ngt  mit  den  verschiedenen  Bedeutungen  des  Wortes\n\
        m\xE9moire zusammen, das sich sowohl mit Ged\xE4chtnis als auch Erinnerung\
        \ \xFCbersetzen l\xE4sst.\n"
    - number: 4
