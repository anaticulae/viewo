      text: " Neben Halbwachs arbeitete auch der Kunst- und Kulturhistoriker Aby Warburg\
        \ in den 1920er Jahren zum kollektiven Ge-\nd\xE4chtnis (Erll 2017: 16-18).\
        \ Halbwachs setzte sich mit \u201Eder sozialen Dimension der Kultur\u201C\
        \ (ebd.: 18) auseinander, d.h. mit\nderen \xDCberlieferung innerhalb von sozialen\
        \ Gruppen. Warburg legte seinen Fokus auf \u201Edie materiale Dimension der\
        \ Kultur\u201C\n(ebd.:  18),  also  auf  kulturelle  Vergegenst\xE4ndlichungen\
        \  (u.a.  literarische  Quellen  und  Feste),  die  bestimmte  Erinnerungen\n\
        hervorrufen und Kultur erhalten k\xF6nnen (ebd.: 18).\n"
