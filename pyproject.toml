[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "viewo"
version = "2.30.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "configos>=0.25.3,<1.0.0",
    "flask_bootstrap>=3.3.7.1,<4.0.0.0",
    "flask>=2.2.2,<3.0.0",
    "flask_caching>=2.0.1,<3.0.0",
    "flask_login>=0.6.2,<1.0.0",
    "flask_moment>=1.0.4,<2.0.0",
    "flask_wTF>=1.0.1,<2.0.0",
    "iamraw>=4.88.13,<5.0.0",
    "legal>=0.3.2,<1.0.0",
    "qvlink>=2.15.6,<3.0.0",
    "protoerror>=3.20.1,<4.0.0",
    "utilo>=2.100.1,<3.0.0",
    "viewo_api>=0.11.4,<1.0.0",
    "viewo_talk>=0.3.1,<1.0.0",
    "writers>=1.6.0,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "gennex==1.1.0",
    "hoverpower==1.7.0",
    "pytest_localserver==0.7.0",
    "queuemo==1.27.4",
    "selenium>=4.4.3,<5.0.0",
    "utilotest==1.1.1",
]
optional = [
    "viewo_waiter>=0.7.1,<1.0.0",
    "admin_helpdesk>=0.3.4,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/viewo"
Repository = "https://github.com/anaticulae/viewo"

[project.scripts]
viewo = "viewo.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "viewo",
    "viewo.api",
    "viewo.api.documents",
    "viewo.api.findings",
    "viewo.api.pageviews",
    "viewo.api.users",
    "viewo.api.visitors",
    "viewo.api_.findings",
    "viewo.result",
    "viewo.result.loader",
    "viewo.user",
    "viewo.view",
    "viewo.waiting",
    "viewo.writing",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "DOCU",
    "HOME",
    "MASTER",
    "ORDER",
    "PAPER",
]
