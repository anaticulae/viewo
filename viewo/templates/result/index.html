{% extends 'base.html' %}

{% block head %}
{{ super() }}
<link rel="stylesheet" type="text/css" media="screen" href="{{ url_for('static', filename='result.css') }}">
<script src="{{ url_for('static', filename='result.js') }}"></script>
<script type="text/javascript">
    let go = function () {
        init()
        onload("{{ process }}")
    }
    jQuery(document).ready(go);
</script>
{% endblock %}

{% block content %}
<h2>Gesamtdurchsicht<span id="finding_status_counter"></span></h2>


<div id="error_page_selector">
    <!-- TODO: sooo dirty -->
    <table width="100%">
        <tr>
            <td width="5%">
                Seite:<br />
                <!-- toggle page selection view -->
                <button type="button" id="error_page_selector_toggle">hide</button><br />
                <!-- previous page -->
                <button type="button" id="error_previous_page">&lt;</button>
                <!-- next page -->
                <button type="button" id="error_next_page">&gt;</button>
            </td>
            <td width="95%">
                <ul id="error_page_selector_list"></ul>
            </td>
        </tr>
    </table>
</div>
<main>
    <aside id="error">
        <ul id="error_list">
        </ul>
        <p id="error_navigator">
            <button type="button" id="finding_previous">Previous</button>
            <button type="button" id="finding_next">Next</button>
        </p>
        <div id="error_content">
            <h4 id="error_message_headline"></h4>
            <div id="error_message"></div>
            <p id="error_options">
                <button type="button" id="finding_select_done"><img src="/static/images/result/right.png" alt="done"
                        width="100%" height="100%" /></button>
                <button type="button" id="finding_select_ignore"><img src="/static/images/result/undecided.png"
                        alt="ignore" width="100%" height="100%" /></button>
                <button type="button" id="finding_select_delete"><img src="/static/images/result/trash.png" alt="delte"
                        width="100%" height="100%" /></button>
            </p>
        </div>
    </aside>
    <article id="error_page_content">
        <strong>ERROR:</strong> Could not reach Server.
    </article>
</main>
{% if waiting %}
<footer>
    <p>
        <a href="/waiting/{{ process }}">zum Wartebereich</a>
    </p>
</footer>
{% endif %}
{% endblock %}
