<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Willkommen - Mahaban</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- logo starts here -->
    <div id="logo">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" width="100%">
    </div>

    <!-- navigation stars here -->
    <div id="nav">
        <ul>
            <li><a href="{{url_for('welcome.show_welcome')}}">Home</a></li>
            <li><a href="{{url_for('documents.view_documents')}}">Dokumente</a></li>
            <li><a href="{{url_for('welcome.show_welcome', page='writing')}}">Schreibhilfe</a></li>
        </ul>
    </div>

    <!-- content starts here -->
    <div id="center">
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- footer starts here  -->
    <div id="footer">
        <p>
            <a href="">Legal Information</a> | <a href="">Privacy Policy</a> |
            <a href="impressum">Impressum</a> | <a href="">Copyright &copy;
                2019 by checkitweg.de</a>
        </p>
    </div>
</body>

</html>
