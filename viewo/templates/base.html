<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Willkommen - Marhaban</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='lib/jquery.js') }}"></script>
    {% block head %}{% endblock %}
</head>

<body class="main_wrapper">
    <!-- logo starts here -->
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" width="100%" style="margin:0px;padding:0px;"
        id="logo" alt="page logo">

    <!-- navigation stars here -->
    <nav class="main">
        <ul>
            <li><a href="{{url_for('welcome.show_welcome')}}">Home</a></li>
            <li><a href="{{url_for('documents.view_documents')}}">Dokumente</a></li>
            <li><a href="{{url_for('welcome.show_welcome', page='writing')}}">Schreibhilfe</a></li>
        </ul>
    </nav>
    <!-- content starts here -->
    {% block content_container %}
    <div id="content_main">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <!-- footer starts here  -->
    <footer>
        <p>
            <a href="">Legal Information</a> | <a href="">Privacy Policy</a> |
            <a href="/impressum">Impressum</a> | <a href="">Copyright &copy;
                2019-2020 by checkitweg.de</a>
        </p>
    </footer>
</body>

</html>
