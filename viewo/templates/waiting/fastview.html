{% extends 'base.html' %}

{% block content %}

{{ css('fastview.css') }}

{{ js('fastview.js') }}

<h2>Schnelldurchsicht</h2>

<table width="600" id="linter_table">
    <tr>
        <th width="500" rowspan="2">Bereich</th>
        <th rowspan="2">Seiten</th>
        <th colspan="4"> Checks </th>
    </tr>
    <tr>
        <th>Passed</th>
        <th>Warning</th>
        <th>Failed</th>
        <th>Gesamt</th>
    </tr>
</table>

<footer>
    <p>
        {{ href(url='waiting.waiting_view', caption='zum Wartebereich', process=process) }}
    </p>
</footer>


{{ onload(process) }}

{% endblock %}
