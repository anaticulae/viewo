{% extends 'base.html' %}

{% block content %}

<link rel="stylesheet" type="text/css" media="screen"
    href="{{ url_for('static', filename='resultview.css') }}">
<script src="{{ url_for('static', filename='resultview.js') }}"></script>

<style>
</style>

<h2>Gesamtdurchsicht</h2>

<div id="error_page_selector">
    <!-- TODO: sooo dirty -->
    <table width="100%">
        <tr>
            <td>
                <p>Seite:</p>
            </td>
            <td width="95%">
                <ul id="error_page_selector_list"></ul>
            </td>
            <td style="min-width:120px;">
                <!-- toggle page selection view -->
                <button type="button" id="error_page_selector_toggle"
                    onclick="javascript:toggle_pages()">hide</button>
                <!-- previous page -->
                <button type="button" onclick="javascript:previous_page()">&lt;</button>
                <!-- next page -->
                <button type="button" onclick="javascript:next_page()">&gt;</button>
            </td>
        </tr>
    </table>
    <p>
    </p>
</div>

<main>
    <aside id="error">
        <ul id="error_list">
        </ul>
        <p id="error_navigator">
            <button type="button" onclick="javascript:previous()">Previous</button>
            <button type="button" onclick="javascript:next()">Next</button>
        </p>
        <div id="error_content">
            <h4 id="error_message_headline"></h4>
            <pre id="error_message"></pre>
        </div>
    </aside>
    <article id="error_page_content">
        <strong>ERROR:</strong> Could not reach Server.
    </article>
</main>

{% if waiting %}
<footer>
    <p>
        <a href="/waiting/{{ process }}">zum Wartebereich</a>
    </p>
</footer>
{% endif %}

<script type="text/javascript">
    onload("{{ process }}")
</script>

{% endblock %}
