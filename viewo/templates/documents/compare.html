{% extends 'base.html' %}

{% block scripts %}
{{ super() }}
{{ js('documents_compare.js') }}
{% endblock %}

{% block pagecontent %}
<h2>Dokument Vergleich</h2>

<div id="documents_compare">
    <div>
        <label style="width:100px;">Aktuell:</label>
        <select name="current" id="documents_compare_current_list" style="width:300px;">
            <!-- <option value="10">10</option> -->
        </select>
        <label style="width:100px;margin-left:50px;">Zuvor:</label>
        <select name="partner" id="documents_compare_partner_list" style="width:300px;">
            <!-- <option value="10">10</option> -->
        </select>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <td width="48%" id="documents_compare_current">Akutell</td>
                <td width="4%" id="documents_compare_partner">Seiten</td>
                <td width="48%" id="documents_compare_partner" class="right">Zuvor</td>
            </tr>
        </thead>
        <tbody id="documents_compare_content"></tbody>
        <tfoot>
            <tr>
                <td id="documents_compare_no_data" colspan="3" class="center">Loading...</td>
            </tr>
        </tfoot>
    </table>
</div>

<div id="documents_compare_error" class="well">
    Service nicht erreichbar.
</div>
{% endblock %}
