{% extends 'base.html' %}

{% block pagecontent %}

<h1>Account Nachrichten</h1>
<div class="content" id="dialogs_list"></div>

<table class="table table-striped table-bordered hidden_invisible" id="dialog_list">
    <thead>
        <tr>
            <td class="large">Nachricht</td>
            <td class="small">Datum</td>
            <td class="small"></td>
        </tr>
    </thead>
    <tbody id="dialog_list_content"></tbody>
</table>

<h2>Neue Nachricht</h2>

<form method="POST" role="form" id="dialog_new" class="form-horizontal">
    <div class="form-group">
        <labbel for="title" class="col-sm-2 control-label">Titel:</labbel>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="title" required="True">
        </div>
    </div>

    <div class="form-group">
        <labbel for="category" class="col-sm-2 control-label">Art:</labbel>
        <div class="col-sm-8">
            <select name="category" id="feedback_type" class="form-control">
                <option value="10">Bezahlung</option>
                <option value="10">Datenschutz</option>
                <option value="10">Feedback</option>
                <option value="10">Sonstiges</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <labbel for="text" class="col-sm-2 control-label">Text:</labbel>
        <div class="col-sm-8">
            <textarea type="text" class="form-control" style="height:150px" name="text" required="True"></textarea>
        </div>
    </div>

    <div class="form-group">
        <labbel class="col-sm-2 control-label"></labbel>
        <div class="col-sm-3">
            <button type="submit" class="btn btn-default">Senden</button>
        </div>
    </div>
</form>


{% endblock %}

{% block scripts %}
{{ super() }}
<script type="text/javascript">
    $("#dialog_new").submit(function (event) {
        event.preventDefault();
        let title = $("input[name='title']")[0].value
        let category = $("select[name='category']")[0].value
        let text = $("textarea[name='text']")[0].value
        send_message(title, text, category)
    });

    function clear() {
        $("input[name='title']")[0].value = ''
        $("textarea[name='text']")[0].value = ''
    }

    function call_update_dialogs() {
        let userid = `{{current_user.get_id()}}`
        $.ajax(`${API}/dialogs/${userid}`, {
            dataType: 'json',
            success: function (response) {
                update_dialogs(response.dialogs)
            },
            error: function () {
                user_error('Could not reach server.')
            }
        });
    }

    function update_dialogs(items) {
        if (items.length == 0) {
            base.hide('#dialog_list')
        } else {
            base.show('#dialog_list')
        }
        content = $('#dialog_list_content')
        content.html = ''
        for (let item of items) {
            row = `<tr><td>title</td>
                <td>${item['date']}</td>
                <td><a href="#">Öffnen</a></td></tr>`
            content.append(row)
        }

    }


    function send_message(title, text, category) {
        let url = `${API}/dialog/add`
        $.ajax({
            type: 'POST',
            url: url,
            data: {
                'title': title,
                'text': text,
                'category': category,
            },
            timeout: TIMEOUT,
            error: function (response) {
            },
            success: function (response) {
                clear()
                user_info('Nachricht übermittelt.')
            }
        });
    }
</script>
{% call js_ready() %}
call_update_dialogs()
{% endcall %}
{% endblock %}
