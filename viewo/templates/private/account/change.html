{% extends 'base.html' %}

{% block content %}

<h1>Account - Ändern</h1>

<p>Account Informationen ändern.</p>

<div class="container">
    <form method="POST" role="form" class="form-horizontal">
        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">Benutzer/E-Mail:</labbel>
            <div class="col-sm-6">
                <input type="text" class="form-control" name="user" value="{{user}}">
            </div>
        </div>

        <div class="form-group">
            <labbel for="password" class="col-sm-2 control-label">Passwort:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="password">
            </div>
            <labbel for="password" class="col-sm-2 control-label">Wiederholen:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="password2">
            </div>
        </div>

        <div class="form-group">
            <labbel class="col-sm-2 control-label"></labbel>
            <div class="col-sm-3">
                <button type="submit" class="btn btn-default">Ändern</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
