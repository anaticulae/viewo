{% extends 'base.html' %}

{% block content %}

<h1>Account ändern</h1>

<p>Account Informationen ändern.</p>

<div class="container">
    <form method="POST" role="form" class="form-horizontal">
        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">Benutzer:</labbel>
            <div class="col-sm-6">
                <input type="text" class="form-control" name="user" value="{{user}}" readonly="True">
            </div>
        </div>

        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">E-Mail:</labbel>
            <div class="col-sm-6">
                <input type="email" class="form-control" name="email" value="{{email}}">
            </div>
        </div>

        <div class="form-group">
            <labbel for="password" class="col-sm-2 control-label">Neues Passwort:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="new_password" value="{{new_password}}">
            </div>
            <labbel for="password" class="col-sm-2 control-label">Wiederholen:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="new_password_repeat" value="{{new_password_repeat}}">
            </div>
        </div>
        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">Passwort:</labbel>
            <div class="col-sm-6">
                <input type="password" class="form-control" name="password" required="True">
            </div>
        </div>

        <div class="form-group">
            <labbel class="col-sm-2 control-label"></labbel>
            <div class="col-sm-3">
                <button type="submit" class="btn btn-default">Ändern</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
