{% extends 'base.html' %}

{% block pagecontent %}

<h1>Account ändern</h1>

<p>Account Informationen ändern.</p>

<div class="container">
    <form id="change_user_data" class="form-horizontal" role="form">
        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">Benutzer:</labbel>
            <div class="col-sm-6">
                <input type="text" class="form-control" name="user" value="{{user}}" readonly="True">
            </div>
        </div>

        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">E-Mail:</labbel>
            <div class="col-sm-6">
                <input type="email" class="form-control" name="email" value="{{email}}">
            </div>
        </div>

        <div class="form-group">
            <labbel for="password" class="col-sm-2 control-label">Neues Passwort:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="password_new" minlength="8" maxlength="64">
            </div>
            <labbel for=" password" class="col-sm-2 control-label">Wiederholen:</labbel>
            <div class="col-sm-2">
                <input type="password" class="form-control" name="password_new_repeat" minlength="8" maxlength="64">
            </div>
        </div>
        <div class="form-group">
            <labbel for="user" class="col-sm-2 control-label">Passwort:</labbel>
            <div class="col-sm-6">
                <input type="password" class="form-control" name="password" required="True" minlength="8"
                    maxlength="64">
            </div>
        </div>

        <div class="form-group">
            <labbel class="col-sm-2 control-label"></labbel>
            <div class="col-sm-3">
                <button id="change_password" type="submit" class="btn btn-default">Ändern</button>
            </div>
        </div>
    </form>
</div>

{% endblock %}

{% block scripts %}
{{ super() }}
<script type="text/javascript">
    $("#change_user_data").submit(function (event) {
        event.preventDefault();
        let userid = $("input[name='user']")[0].value
        let email = $("input[name='email']")[0].value
        let password = $("input[name='password']")[0].value
        let password_new = $("input[name='password_new']")[0].value
        let password_new_repeat = $("input[name='password_new_repeat']")[0].value
        update_user_data(userid, email, password, password_new, password_new_repeat)
    });

    function update_user_data(userid, email, password, password_new, password_new_repeat) {
        let url = `${API}/users/${userid}`
        $.ajax({
            type: 'PUT',
            url: url,
            data: {
                'email': email,
                'password': password,
                'password_new': password_new,
                'password_new_repeat': password_new_repeat,
            },
            success: function (respone) {
                user_error('Daten erfolgreich geändert.')
            },
            error: function (request, textStatus, error) {
                // TODO: ADD ERROR HANDLER
                user_error(request.responseJSON['message'])
            }
        });
    }
</script>
{% endblock %}
