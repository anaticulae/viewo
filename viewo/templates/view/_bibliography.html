<style>
    #pdfview_bibliography {
        display: block;
    }

</style>

<h2>Bibliographie</h2>

<table class="table table-striped dataTable no-footer" id="bibliography_list" role="grid">
    <thead>
        <tr role="row">
            <th tabindex="0" class="sorting" aria-controls="bibliography_list" rowspan="1" colspan="1">Titel</th>
            <th tabindex="1" class="sorting" aria-controls="bibliography_list" rowspan="1" colspan="1">Author</th>
            <th tabindex="1" class="sorting" aria-controls="bibliography_list" rowspan="1" colspan="1">Jahr</th>
        </tr>
    </thead>
    <tbody>
        <tr class="odd">
            <td class="dataTables_empty" valign="top" colspan="3">Keine Daten verfügbar.</td>
        </tr>
    </tbody>
</table>
