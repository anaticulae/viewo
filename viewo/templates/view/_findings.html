<style>
    #pdfview_findings {
        display: block;
    }

</style>

<h2>Fehlerübersicht</h2>

<div class="form-group right">
    <label class="btn btn-danger" for="select_critical">Fehler
        <input id="select_critical" type="checkbox" checked="True">
    </label>
    <label class="btn btn-warning" for="select_error">Warnung
        <input id="select_error" type="checkbox" checked="True">
    </label>
    <label class="btn btn-success" for="select_improvement">Vorschlag
        <input id="select_improvement" type="checkbox" checked="True">
    </label>
    <label class="btn btn-info" for="select_closed">Geschlossen
        <input id="select_closed" type="checkbox">
    </label>
</div>

<table class="table table-striped dataTable no-footer" id="finding_list" role="grid">
    <thead>
        <tr role="row">
            <th tabindex="0" class="sorting" aria-controls="finding_list" rowspan="1" colspan="1">Titel</th>
            <th tabindex="1" class="sorting" aria-controls="finding_list" rowspan="1" colspan="1">Seite</th>
            <th tabindex="1" class="sorting" aria-controls="finding_list" rowspan="1" colspan="1">Typ</th>
            <th tabindex="1" class="sorting" aria-controls="finding_list" rowspan="1" colspan="1">Status</th>
        </tr>
    </thead>
    <tbody>
        <tr class="odd">
            <td class="dataTables_empty" valign="top" colspan="3">Keine Daten verfügbar.</td>
        </tr>
    </tbody>
</table>

<img src="{{process}}/feedback__plot_findings_histogram.png" alt="Fehler Histogram" width="100%"
    style="border:1px solid black;" />
