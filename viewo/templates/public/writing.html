{% extends 'base.html' %}


{% block head %}


{{ super() }}

<link href="/build/_static/wclub.css" rel="stylesheet" type="text/css">
<script type="text/javascript" src="/build/_static/jquery.js"></script>
<script type="text/javascript" id="documentation_options" data-url_root="/build/"
    src="/build/_static/documentation_options.js"></script>
<script type="text/javascript" src="/build/_static/jquery.js"></script>
<script type="text/javascript" src="/build/_static/underscore.js"></script>
<script type="text/javascript" src="/build/_static/doctools.js"></script>
<script type="text/javascript" src="/build/_static/language_data.js"></script>
<script type="text/javascript" src="/build/_static/translations.js"></script>
<script type="text/javascript" src="/build/_static/searchtools.js"></script>

<script type="text/javascript">
    jQuery(function () { Search.loadIndex("/build/searchindex.js"); });
</script>

<script type="text/javascript" id="searchindexloader"></script>

<style>
    @media only screen and (max-width: 750px) {
        body {
            color: black;
        }

        .wrapper {
            border: 0px;
            padding: 0px;
            height: 97%;
            overflow-y: auto;
        }

        #content {
            padding: 0px;
            overflow: visible;
        }

        nav {
            width: 100%;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            margin: 0px;
            padding: 0px;
            margin-bottom: 20px;
        }

        .mastertoc a {
            font-size: 24px;
        }

        .highlight {
            border: 0px;
        }

        .footnote {
            border: 0px;
        }
    }

</style>

{% endblock %}

{% block content_container %}

{{ content |safe}}

{% endblock %}
