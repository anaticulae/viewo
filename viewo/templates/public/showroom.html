<style>
    .well {
        margin-right: 20px;
    }

</style>

<aside id="showroom" class="top-pad">
    {% for document in documents %}
    {% if document['result'] %}
    <div class="well example">
        <h3><a href="{{ url_for('result.view_result', documentid=document['name']) }}">{{document['title']}}</a>
        </h3>
        {% set pages = document['result']['closed'] + document['result']['excluded'] + document['result']['open'] %}
        Seiten: <span class="badge badge-secondary badge-pill">{{document['pages']}}</span><br />
        Fehler: <span class="badge badge-secondary badge-pill btn-danger">{{pages}}</span><br />
    </div>
    {% endif %}
    {% endfor %}
</aside>
